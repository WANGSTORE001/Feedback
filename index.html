<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reputasi — WANG STORE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --gold: #ffd700;
            --green: #25D366;
            --red: #ff4444;
            --blue: #2196F3;
            --discord: #7289da;
            --dark: #05071a;
            --card: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08);
        }

        body {
            min-height: 100vh;
            padding: 30px 20px;
            color: #fff;
            background:
                radial-gradient(circle at 10% 20%, rgba(255, 215, 0, 0.1), transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 128, 0.1), transparent 50%),
                linear-gradient(180deg, #05071a 0%, #0b102b 50%, #05071a 100%);
            background-attachment: fixed;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.25);
            backdrop-filter: blur(10px);
        }

        header h1 {
            font-size: 1.7rem;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .subtitle {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .contact-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .contact-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #ddd;
            text-decoration: none;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .contact-link:hover {
            transform: translateY(-2px);
        }

        .contact-link.wa { border-color: rgba(37, 211, 102, 0.4); }
        .contact-link.discord { border-color: rgba(114, 137, 218, 0.4); }

        .rating-summary {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .rating-score {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--gold);
        }

        .stars {
            font-size: 1.3rem;
            color: var(--gold);
        }

        .total-reviews {
            color: #888;
            font-size: 0.85rem;
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 10px;
        }

        .tab-btn {
            padding: 8px 14px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: rgba(255, 215, 0, 0.15);
            color: var(--gold);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold);
        }

        .stat-label {
            font-size: 0.8rem;
            color: #888;
            margin-top: 4px;
        }

        .rating-breakdown {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 25px;
        }

        .rating-breakdown h3 {
            font-size: 0.95rem;
            color: #ddd;
            margin-bottom: 15px;
        }

        .rating-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
        }

        .rating-label {
            width: 40px;
            font-size: 0.85rem;
        }

        .rating-bar-container {
            flex: 1;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .rating-bar {
            height: 100%;
            background: var(--gold);
            border-radius: 4px;
            transition: width 0.5s;
        }

        .rating-percent {
            width: 45px;
            text-align: right;
            font-size: 0.8rem;
            color: #888;
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .search-box input, .search-box select {
            flex: 1;
            min-width: 140px;
            margin: 0;
        }

        .form-section {
            background: rgba(37, 211, 102, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(37, 211, 102, 0.25);
            padding: 22px;
            margin-bottom: 25px;
        }

        .form-section h2 {
            color: var(--green);
            font-size: 1rem;
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #ddd;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        label span.required {
            color: var(--red);
            margin-left: 3px;
        }

        label span.optional {
            color: #888;
            font-size: 0.75rem;
            margin-left: 8px;
        }

        input, textarea, select, button {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 0.9rem;
        }

        input.error, select.error, textarea.error {
            border-color: var(--red);
            box-shadow: 0 0 0 1px var(--red);
        }

        input::placeholder, textarea::placeholder {
            color: #666;
        }

        .error-text {
            color: #ff6666;
            font-size: 0.75rem;
            margin: -8px 0 10px;
            display: none;
        }

        .upload-area {
            border: 2px dashed rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 14px;
            transition: 0.2s;
        }

        .upload-area:hover {
            border-color: rgba(255, 215, 0, 0.6);
            background: rgba(255, 215, 0, 0.03);
        }

        .upload-icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        #photoInput { display: none; }

        .photo-preview-container {
            position: relative;
            display: inline-block;
            margin-bottom: 14px;
        }

        .photo-preview {
            max-width: 100%;
            max-height: 180px;
            border-radius: 8px;
            object-fit: cover;
        }

        .remove-photo {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--red);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button {
            background: linear-gradient(90deg, #ffd700, #ffaa00);
            color: #000;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover { transform: scale(1.02); }

        button.small-btn {
            width: auto;
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .btn-danger {
            background: linear-gradient(90deg, #ff4444, #cc0000);
            color: #fff;
        }

        .btn-success {
            background: linear-gradient(90deg, #25D366, #1fb855);
            color: #fff;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .review-card {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            margin-bottom: 14px;
            transition: 0.2s;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .review-name {
            font-weight: 600;
            color: #fff;
            font-size: 0.95rem;
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(37, 211, 102, 0.12);
            color: var(--green);
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
        }

        .review-stars {
            color: var(--gold);
            font-size: 0.85rem;
        }

        .review-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }

        .meta-tag {
            background: rgba(255, 215, 0, 0.1);
            color: var(--gold);
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .meta-tag.amount {
            background: rgba(37, 211, 102, 0.1);
            color: var(--green);
        }

        .review-date {
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 8px;
        }

        .review-text {
            color: #ccc;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .review-image {
            max-width: 100%;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 10px;
        }

        .review-image:hover { transform: scale(1.01); }

        .review-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            padding-top: 8px;
            border-top: 1px dashed rgba(255,255,255,0.08);
        }

        .like-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 0.8rem;
            padding: 4px 8px;
            cursor: pointer;
            transition: 0.2s;
            margin: 0;
            width: auto;
        }

        .like-btn:hover, .like-btn.liked {
            color: #ff6b8a;
        }

        .reply-btn, .share-btn {
            background: transparent;
            border: none;
            color: #888;
            font-size: 0.75rem;
            padding: 4px 8px;
            cursor: pointer;
            margin: 0;
            width: auto;
        }

        .reply-btn:hover { color: var(--gold); }
        .share-btn:hover { color: var(--blue); }

        .owner-reply {
            background: rgba(37, 211, 102, 0.05);
            border-left: 2px solid var(--green);
            padding: 10px 12px;
            margin-top: 10px;
            border-radius: 0 6px 6px 0;
        }

        .reply-label {
            font-size: 0.7rem;
            color: var(--green);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .reply-text {
            font-size: 0.85rem;
            color: #aaa;
            line-height: 1.5;
        }

        .reply-form {
            margin-top: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
        }

        .reply-form textarea {
            margin-bottom: 8px;
        }

        .faq-section h2 {
            color: var(--gold);
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .faq-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .faq-question {
            padding: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .faq-toggle {
            transition: transform 0.3s;
        }

        .faq-answer {
            padding: 0 15px 15px;
            display: none;
            font-size: 0.85rem;
            color: #aaa;
            line-height: 1.7;
        }

        .faq-answer.show { display: block; }
        .faq-item.open .faq-toggle { transform: rotate(45deg); }

        .payment-methods {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .payment-tag {
            background: rgba(37, 211, 102, 0.1);
            color: var(--green);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--green);
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 9999;
            transform: translateY(-100px);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        .image-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .image-modal img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 8px;
        }

        .image-modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #fff;
            font-size: 26px;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            font-size: 0.9rem;
        }

        .success-msg, .warning-box {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            display: none;
            font-size: 0.85rem;
        }

        .success-msg {
            background: rgba(37, 211, 102, 0.1);
            border: 1px solid rgba(37, 211, 102, 0.3);
            color: var(--green);
        }

        .warning-box {
            background: rgba(255, 170, 0, 0.08);
            border: 1px solid rgba(255, 170, 0, 0.3);
            color: #ffcc00;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #666;
            font-size: 0.8rem;
        }

        .admin-toggle {
            color: #333;
            font-size: 0.7rem;
            cursor: pointer;
            user-select: none;
            margin-top: 8px;
        }

        .hidden { display: none !important; }
        .admin-status {
            display: inline-block;
            background: rgba(37, 211, 102, 0.15);
            color: var(--green);
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            margin-left: 6px;
        }
    </style>
</head>
